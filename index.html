<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navalha &amp; Cia | Agendamento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#F2F4F8;--card:#fff;--tx:#14213D;--mut:#5B657A;--line:#D9DEE8;--acc:#C8352B;--btn:#14213D;--btnt:#fff;--ok:#1E7A4C;--okb:#E2F3EA;--bad:#B3261E;--badb:#FBE5E3;--sel:#FDECEA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1422;--card:#172036;--tx:#EAEFF8;--mut:#9AA6BF;--line:#2A3550;--acc:#F0665B;--btn:#EAEFF8;--btnt:#0E1422;--ok:#5FD39A;--okb:#12382A;--bad:#FF8A80;--badb:#43191A;--sel:#3A1E24}}
:root[data-theme="dark"]{--bg:#0E1422;--card:#172036;--tx:#EAEFF8;--mut:#9AA6BF;--line:#2A3550;--acc:#F0665B;--btn:#EAEFF8;--btnt:#0E1422;--ok:#5FD39A;--okb:#12382A;--bad:#FF8A80;--badb:#43191A;--sel:#3A1E24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Source Sans 3",sans-serif;margin:0;line-height:1.15}
.pole{height:8px;background:repeating-linear-gradient(-45deg,#C8352B 0 10px,#fff 10px 20px,#2F5DA8 20px 30px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font:700 20px "Bricolage Grotesque",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 12px}
footer{text-align:center;color:var(--mut);font-size:14px;padding:12px 16px 24px}
.stars{color:var(--acc);letter-spacing:2px}
.star{color:var(--acc);font-size:26px;line-height:1;padding:4px 10px;min-height:44px}
textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;color:inherit;min-height:70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:22px;margin-bottom:10px}h3{font-size:17px;margin-bottom:8px}
.sm{font-size:14px;color:var(--mut);margin:4px 0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--btn);color:var(--btnt);border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
.chip.on{border-color:var(--acc);background:var(--sel);font-weight:600}
.chip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.chip.day{text-align:center;line-height:1.2}
.home{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:20px}
.home .card{cursor:pointer;text-align:left;padding:24px}
.home h2{font-size:26px}
.plan{display:grid;gap:4px;border-left:6px solid var(--line)}
.plan.ok{border-left-color:var(--ok)}.plan.bad{border-left-color:var(--bad)}
.badge{display:inline-block;width:max-content;border-radius:99px;padding:2px 12px;font-size:14px;font-weight:600;background:var(--line)}
.badge.ok{background:var(--okb);color:var(--ok)}.badge.bad{background:var(--badb);color:var(--bad)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.svc{text-align:left;display:block;width:100%}
.svc b{display:block}.old{text-decoration:line-through;color:var(--mut)}.inc{color:var(--ok);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;font-size:15px;vertical-align:middle}
th{font-weight:600;color:var(--mut)}
td.cell{cursor:pointer;min-width:110px}
td.cell.free{color:var(--mut)}td.cell.busy{background:var(--sel)}td.cell.off{background:var(--line);color:var(--mut);cursor:default}
td.cell.pick{outline:3px solid var(--acc);outline-offset:-3px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut)}
select,input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.lock{background:var(--line);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:10px 18px;border-radius:8px;display:none;z-index:9;max-width:90%}
@media (prefers-reduced-motion:no-preference){.card,.chip{transition:border-color .15s,background .15s}}
a.btn{display:inline-block;text-decoration:none}
a{color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.demo{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--line);border-radius:8px;padding:8px 12px;font-size:14px;margin:0 0 12px;color:var(--mut)}
.demo select{min-height:34px;padding:4px 8px}
.shop{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.cover{height:150px;position:relative;color:#fff;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px),linear-gradient(135deg,#0E1A35,#14213D 55%,#27508F)}
.cover svg{position:absolute;right:12px;top:-10px;opacity:.18}
.logo{width:88px;height:88px;border-radius:50%;background:#14213D;color:#fff;border:4px solid var(--card);display:grid;place-items:center;font:700 26px "Bricolage Grotesque",sans-serif;margin:-44px 0 0 16px;position:relative;box-shadow:inset 0 -6px 0 #C8352B}
.shop-info{padding:8px 16px 16px}
.shop-info h1{font-size:26px;margin:8px 0}
.meta{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px;text-align:left}
.meta svg{flex:none;margin-top:3px}
.open{color:var(--ok);font-weight:600}.closed{color:var(--bad);font-weight:600}
.ttabs{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tt{background:none;border:0;border-bottom:3px solid transparent;padding:10px 0;font:700 19px "Bricolage Grotesque",sans-serif;color:var(--mut);cursor:pointer;white-space:nowrap}
.tt.on{color:var(--tx);border-bottom-color:var(--acc)}
.tt:focus-visible,.pill:focus-visible,.opt:focus-visible,.club:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.club{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#F6D56B;color:#1B1B1B;border:1px solid #E0B93E;border-radius:10px;padding:14px;cursor:pointer;margin-bottom:16px;font:inherit}
.pills{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.pill{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 16px;cursor:pointer;white-space:nowrap;min-height:40px;font:inherit}
.pill.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.scard{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.sico{width:84px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#14213D,#27508F)}
.sbody{flex:1;padding:12px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.btn.out{align-self:center;margin-right:12px;background:transparent;color:var(--tx);border:1px solid var(--tx);padding:8px 14px}
.bar .cta{flex:1;max-width:640px;margin:0 auto;font-size:18px;padding:14px}
.avatar{width:48px;height:48px;border-radius:50%;background:#14213D;color:#fff;display:grid;place-items:center;font:700 18px "Bricolage Grotesque",sans-serif;flex:none}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;font:inherit}
.opt.on{border-color:var(--acc);background:var(--sel)}
.steps{display:flex;gap:6px;margin:8px 0 16px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--acc)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.strip .chip{min-width:62px}
.okc{width:72px;height:72px;border-radius:50%;background:var(--okb);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
body[data-v="home"] .brand{visibility:hidden}
body[data-v="home"] header{background:transparent;border-color:transparent}
.login{display:grid;gap:16px;max-width:880px;margin:8px auto 0}
@media (min-width:760px){.login{grid-template-columns:1.1fr 1fr;margin-top:24px}}
.lbrand{position:relative;overflow:hidden;border-radius:16px;color:#fff;padding:28px 24px;display:flex;flex-direction:column;gap:6px;min-height:220px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px),linear-gradient(135deg,#0E1A35,#14213D 55%,#27508F)}
.lbrand h1{font-size:32px}
.lbrand p{margin:0;opacity:.8}
.lbrand .deco{position:absolute;right:-30px;bottom:-40px;opacity:.12;pointer-events:none}
.logo.big{margin:0 0 10px;width:72px;height:72px;font-size:22px;border:3px solid rgba(255,255,255,.3)}
.lbul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;position:relative}
.lbul li{display:flex;gap:8px;align-items:center}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:14px;align-content:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;border-radius:8px;padding:10px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.chk{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;flex:none}
.opt.on .chk{background:var(--acc);border-color:var(--acc);color:#fff}
body[data-v="staff"] main{max-width:1180px}
.admin{display:grid;gap:16px}
.side{display:flex;gap:6px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;scrollbar-width:none}
@media (min-width:860px){.admin{grid-template-columns:230px 1fr;align-items:start}.side{position:sticky;top:12px;flex-direction:column;overflow:visible}}
.nv{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:10px;padding:10px 12px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.nv.on{background:var(--btn);color:var(--btnt)}
.nv:focus-visible,.cell:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.nv .dot{font-style:normal;background:var(--acc);color:#fff;border-radius:99px;font-size:12px;padding:0 7px;margin-left:auto}
.adm-main{min-width:0}
.adm-top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.who{display:flex;gap:8px;align-items:end}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column}
.kpi b{font:700 24px "Bricolage Grotesque",sans-serif}
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.daynav input{margin-left:auto}
.agenda{background:var(--card);border:1px solid var(--line);border-radius:12px}
.grid-t{table-layout:fixed}
.grid-t th,.grid-t td{border:1px solid var(--line);padding:3px}
.grid-t thead th{background:var(--bg)}
.grid-t th.tm{width:64px;color:var(--mut);font-size:13px;text-align:center;background:var(--bg)}
td.cell{height:46px;vertical-align:top;min-width:0}
td.cell.fr{color:var(--line);text-align:center;vertical-align:middle;cursor:pointer}
td.cell.fr:hover{background:var(--sel);color:var(--acc)}
td.cell.off{background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px);text-align:center;vertical-align:middle;cursor:default}
.ev{height:100%;min-height:40px;border-radius:6px;border-left:4px solid;padding:4px 8px;display:flex;flex-direction:column;font-size:14px;line-height:1.25;cursor:pointer;overflow:hidden}
.ev.ag{background:color-mix(in srgb,#2F5DA8 20%,var(--card));border-color:#2F5DA8}
.ev.ok{background:color-mix(in srgb,var(--ok) 20%,var(--card));border-color:var(--ok)}
.ev.falt{background:color-mix(in srgb,var(--bad) 20%,var(--card));border-color:var(--bad)}
.ev.pick,td.cell.pick{outline:3px solid var(--acc);outline-offset:-3px}
.bh{display:flex;gap:8px;align-items:center;text-align:left}
.avatar.sm{width:34px;height:34px;font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mut);margin:10px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);z-index:5}
.arow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.atime{width:72px;flex:none}.abody{flex:1;min-width:160px}.aact{display:flex;gap:8px;align-items:center}
.rep{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:10px;padding:12px;margin-bottom:12px}
.repi{width:40px;height:40px;border-radius:50%;background:var(--sel);color:var(--acc);display:grid;place-items:center;flex:none}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px;border:1px solid #dadce0;border-radius:10px;background:#fff;color:#3c4043;font:600 16px "Source Sans 3",system-ui,sans-serif;cursor:pointer}
.gbtn svg{width:20px;height:20px}
.gbtn:hover{background:#f8f9fa}
.gbtn:focus-visible,.acc:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.acc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;cursor:pointer;font:inherit;margin-bottom:8px}
.acc:hover{background:var(--sel)}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{background:var(--badb);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px}
.pick{padding:16px;margin-bottom:0}
.pick .pi{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#14213D,#27508F);color:#fff;display:grid;place-items:center;flex:none}
details.dd{border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:var(--mut)}
details.dd summary{cursor:pointer;font-weight:600;color:var(--tx)}
</style>
</head>
<body>
<div class="pole"></div>
<header><div class="brand">Navalha &amp; Cia</div><div class="row" style="align-items:center;flex-wrap:nowrap"><div id="top"></div><button class="btn ghost" id="th" style="padding:8px 10px;line-height:0"></button></div></header>
<main id="app"></main>
<footer>Desenvolvido por <b>Vijo Digital</b></footer>
<div id="toast" role="status"></div>
<script>
const PL={none:{n:'Sem plano',inc:[]},barba:{n:'Plano Barba',p:79,inc:['barba']},cabelo:{n:'Plano Cabelo',p:99,inc:['corte']},combo:{n:'Plano Barba e Cabelo',p:149,inc:['corte','barba','combo']}};
const SV=[{id:'corte',n:'Corte',p:45,m:30,c:'Cabelo',d:'Corte na tesoura ou máquina com finalização.'},{id:'barba',n:'Barba',p:35,m:30,c:'Barba',d:'Barba com toalha quente e navalha.'},{id:'combo',n:'Corte + Barba',p:70,m:60,c:'Combos',d:'Corte e barba completos no mesmo horário.'},{id:'sobr',n:'Sobrancelha',p:15,m:30,c:'Estética',d:'Design e limpeza da sobrancelha.'},{id:'pig',n:'Pigmentação',p:40,m:30,c:'Estética',d:'Pigmentação de barba ou cabelo.'},{id:'hid',n:'Hidratação',p:30,m:30,c:'Estética',d:'Hidratação capilar profunda.'}];
const BB=[{id:1,n:'Thiago',on:true,wk:[2,3,4,5,6],od:[]},{id:2,n:'Bruno',on:true,wk:[1,3,4,5,6],od:[]},{id:3,n:'Anderson',on:true,wk:[1,2,4,5,6],od:[]},{id:4,n:'Leandro',on:true,wk:[1,2,3,5,6],od:[]}];
const ACT=()=>BB.filter(b=>b.on);
const TM=[];for(let h=9;h<19;h++){if(h===12)continue;const s=String(h).padStart(2,'0');TM.push(s+':00',s+':30')}
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addD=n=>{const d=today();d.setDate(d.getDate()+n);return d};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00:00');
const fd=d=>d.toLocaleDateString('pt-BR');
const wd=d=>d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const CL=[{id:1,n:'Carlos Silva',t:'(21) 98888-1111',pl:'barba',st:iso(addD(-5))},{id:2,n:'Marcos Pereira',t:'(21) 97777-2222',pl:'cabelo',st:iso(addD(-12))},{id:3,n:'Felipe Souza',t:'(21) 96666-3333',pl:'combo',st:iso(addD(-20))},{id:4,n:'Diego Alves',t:'(21) 95555-4444',pl:'none',st:null},{id:5,n:'Lucas Rocha',t:'(21) 94444-5555',pl:'combo',st:iso(addD(-45))}];
let uid=0;const AP=[];
for(let k=0;k<8;k++)BB.forEach(b=>TM.forEach((tm,i)=>{if((i*5+b.id*3+k*7)%6===0)AP.push({id:++uid,d:iso(addD(k)),tm,b:b.id,c:((i+k)%5)+1,s:SV[(i+k)%3].id})}));
const S={v:'home',cid:1,sv:'corte',day:0,sel:null,role:'dono',tab:'agenda',sd:0,cell:null,rm:0,ct:'sv',rf:null,bf:null,cat:'Todos',q:'',lp:'client',cq:'',cf:'Todos',user:null,gp:false,ap:null,am:'in',err:'',af:{}};
const nextOpen=()=>{let n=0;while(addD(n).getDay()===0)n++;return n};S.day=S.sd=nextOpen();
const endOf=c=>{if(c.pl==='none')return null;const d=pd(c.st);d.setMonth(d.getMonth()+1);return d};
const status=c=>{const e=endOf(c);if(!e)return{t:'Sem plano',k:'none'};const left=Math.round((e-today())/864e5);return{t:left>=0?'Ativo':'Vencido',k:left>=0?'ok':'bad',left,e}};
const sv=id=>SV.find(x=>x.id===id),cl=id=>CL.find(x=>x.id==id),bb=id=>BB.find(x=>x.id==id);
const works=(d,b)=>b.wk.includes(d.getDay())&&!b.od.includes(iso(d));
const SW=['corte','corte','combo','barba','corte','sobr','combo','hid','corte','pig'],NB={1:4,2:5,3:6,4:7};
for(let k=-130;k<0;k++){const d=addD(k);BB.forEach(b=>{if(!works(d,b))return;TM.forEach((tm,i)=>{if((i*7+b.id*5+k*3+1000)%NB[b.id]===0)AP.push({id:++uid,d:iso(d),tm,b:b.id,c:((i+k+1000)%5)+1,s:SW[(i+k+b.id+1000)%10],st:(i+k+1000)%11===0?'falt':'ok'})})})}

const COMP={combo:['corte','barba']};
const due=(inc,id)=>{if(inc.includes(id))return 0;const ps=COMP[id];if(ps){const rest=ps.filter(p=>!inc.includes(p));if(rest.length<ps.length)return rest.reduce((s,p)=>s+sv(p).p,0)}return sv(id).p};
const incOn=(c,di)=>{const e=endOf(c);return e&&di>=c.st&&di<=iso(e)?PL[c.pl].inc:[]};
const covParts=(inc,id)=>(COMP[id]||[id]).filter(p=>inc.includes(p)||inc.includes(id));
const dur=f=>f.svs.reduce((s,id)=>s+sv(id).m,0);
const slotsFor=(d,b,m)=>TM.filter(tm=>fits(d,bb(b),tm,m));

const pickPro=f=>fits(addD(f.day),bb(f.b),f.tm,dur(f))?f.b:null;

 ${ACT().map(b=>`<section class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">${b.n}</h3><button class="btn ghost" data-a="delb" data-v="${b.id}">Remover barbeiro</button></div><p class="sm">Dias de trabalho na semana</p><div class="row">${[1,2,3,4,5,6].map(w=>chip('wk',b.id+'|'+w,NM[w],b.wk.includes(w))).join('')}</div><p class="sm" style="margin-top:12px">Folga em uma data específica</p><div class="row" style="align-items:end"><input type="date" id="fd${b.id}" min="${hoje}" aria-label="Data da folga de ${b.n}"><button class="btn ghost" data-a="addoff" data-v="${b.id}">Marcar folga</button></div><div class="row" style="margin-top:8px">${b.od.filter(x=>x>=hoje).sort().map(x=>`<button class="chip" data-a="deloff" data-v="${b.id}|${x}">${fd(pd(x))} (remover)</button>`).join('')||'<span class="sm">Nenhuma folga marcada.</span>'}</div></section>`).join('')}`;
}
function reportView(){
 const T=today(),mo=m=>new Date(T.getFullYear(),T.getMonth()-m,1),key=m=>iso(mo(m)).slice(0,7),lim=iso(T);
 const cuts=m=>AP.filter(a=>a.d.slice(0,7)===key(m)&&a.d<=lim&&stOf(a)==='ok'&&(a.s==='corte'||a.s==='combo'));
 const lab=m=>mo(m).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 const L=cuts(S.rm),prev=cuts(S.rm+1).length,tot=L.length;
 const A=AP.filter(a=>a.d.slice(0,7)===key(S.rm)&&a.d<=lim&&stOf(a)==='ok'),incAt=a=>incOn(cl(a.c),a.d),byPlan=a=>incAt(a).includes('corte');
 const R=BB.map(b=>{const l=L.filter(a=>a.b===b.id);return{b,n:l.length,pl:l.filter(byPlan).length,rev:A.filter(a=>a.b===b.id).reduce((s,a)=>s+due(incAt(a),a.s),0)}}).filter(r=>r.b.on||r.n>0).sort((x,y)=>y.n-x.n),max=(R[0]&&R[0].n)||1;
 const totPl=R.reduce((s,r)=>s+r.pl,0),totRev=R.reduce((s,r)=>s+r.rev,0);
 const simples=L.filter(a=>a.s==='corte').length,diff=S.rm===1&&prev?Math.round((tot-prev)/prev*100):null;
 return `<section class="card"><h3>Relatório mensal de cortes</h3><div class="row">${[0,1,2].map(m=>chip('rm',m,lab(m),S.rm===m)).join('')}</div>
 <p style="font:700 44px/1.1 'Bricolage Grotesque',sans-serif;margin:16px 0 0">${tot}</p>
 <p class="sm">cortes em ${lab(S.rm)}${S.rm===0?' (até hoje)':''}${diff===null?'':', '+(diff>=0?'+':'')+diff+'% em relação ao mês anterior'}</p>
 <p class="sm">${simples} cortes simples e ${tot-simples} cortes com barba.</p>
 <p class="sm">${totPl} cortes pelo plano e ${tot-totPl} avulsos. Faturamento avulso do mês: <b>${brl(totRev)}</b>.</p></section>
 <section class="card"><h3>Ranking de cortes por barbeiro</h3>${R.map((r,i)=>`<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;gap:8px"><span><b>${i+1}º</b> ${r.b.n}${r.b.on?'':' (ex-barbeiro)'}</span><span><b>${r.n}</b> cortes${tot?' ('+Math.round(r.n/tot*100)+'%)':''}</span></div><div style="background:var(--line);border-radius:6px;height:12px;margin-top:4px"><div style="width:${r.n/max*100}%;height:100%;background:var(--acc);border-radius:6px"></div></div><p class="sm" style="margin:4px 0 0">${r.pl} pelo plano, ${r.n-r.pl} avulsos. Faturamento avulso: ${brl(r.rev)}. Avaliação: ${rt(r.b.id)}</p></div>`).join('')}
 <p class="sm">Cortes: Corte e Corte + Barba marcados como concluídos (faltas e cancelamentos não entram). Pelo plano: cliente com plano vigente na data e serviço incluído. Faturamento: valor cobrado fora do plano, sem a mensalidade dos planos.</p></section>
 <section class="card"><h3>Avaliações recentes</h3>${RT.slice().reverse().filter(r=>r.t).slice(0,5).map(r=>`<p><span class="stars">${stars(r.s)}</span> ${bb(r.b).n}, ${cl(r.c).n.split(' ')[0]}<br><span class="sm">${esc(r.t)}</span></p>`).join('')||'<p class="sm">Ainda sem comentários.</p>'}</section>`;
}
function render(){
 if(!S.user)S.v='home';document.body.dataset.v=S.v;$a.innerHTML=S.v==='home'?home():S.v==='client'?clientView():staffView();
 $t.innerHTML=S.v==='home'?'':'<button class="btn ghost" data-a="logout">Sair</button>';
}
const $a=document.getElementById('app'),$t=document.getElementById('top'),$toast=document.getElementById('toast');
const toast=m=>{$toast.textContent=m;$toast.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>$toast.style.display='none',2600)};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const a=t.dataset.a,v=t.dataset.v;
 if(a==='go'){S.v=v;S.sel=null;S.cell=null;S.bf=null}
 else if(a==='cancel'){const i=AP.findIndex(x=>x.id==v);if(i>-1)AP.splice(i,1);S.cell=null;toast('Agendamento cancelado.')}
 else if(a==='tab'){S.tab=v;S.cell=null}
 else if(a==='rm')S.rm=+v;
 else if(a==='cat')S.cat=v;
 else if(a==='newbook')S.bf={st:'sv',svs:[],b:null,day:0,tm:null};
 else if(a==='bookSv')S.bf={st:'sv',svs:[v],b:null,day:0,tm:null};
 else if(a==='bookPro')S.bf={st:'sv',svs:[],b:+v,day:0,tm:null};
 else if(a==='bf-tog'){let L=S.bf.svs;if(L.includes(v))L=L.filter(x=>x!==v);else{if(v==='combo')L=L.filter(x=>x!=='corte'&&x!=='barba');if(v==='corte'||v==='barba')L=L.filter(x=>x!=='combo');L=L.concat(v)}S.bf.svs=SV.map(x=>x.id).filter(x=>L.includes(x));S.bf.tm=null}
 else if(a==='bf-svnext'){if(!S.bf.svs.length)return;S.bf.tm=null;S.bf.st=S.bf.b!==null?'time':'pro';if(S.bf.st==='time')S.bf.day=firstDay(S.bf)}
 else if(a==='bf-pro'){S.bf.b=+v;S.bf.tm=null;S.bf.st='time';S.bf.day=firstDay(S.bf)}
 else if(a==='bf-confirm'){const f=S.bf,c=cl(S.cid),bid=pickPro(f);if(!bid){f.st='time';f.tm=null;toast('Esse horário acabou de ser ocupado. Escolha outro.')}else{const d=addD(f.day),di=iso(d),inc=incOn(c,di);let x=mn(f.tm),tt=0;f.svs.forEach(id=>{AP.push({id:++uid,d:di,tm:hm(x),b:bid,c:c.id,s:id});x+=sv(id).m;tt+=due(inc,id)});S.bf={st:'ok',res:{sv:f.svs.map(id=>sv(id).n).join(' + '),pro:bb(bid).n,when:cap(wd(d))+', '+fd(d)+' às '+f.tm,price:tt?'Total a pagar na barbearia: '+brl(tt):'Tudo incluso no seu plano. Nada a pagar.'}};toast('Agendamento confirmado.')}}
 else if(a==='ap'){S.ap=v;S.am='in';S.err='';S.af={};S.gp=false}
 else if(a==='apback'){S.ap=null;S.err='';S.af={};S.gp=false}
 else if(a==='am'){S.am=v;S.err='';S.af={}}
 else if(a==='submit')doAuth();
 else if(a==='gopen')S.gp=true;
 else if(a==='gclose')S.gp=false;
 else if(a==='gpick'){if(v==='new'){if(S.ap==='staff'){S.gp=false;S.err='Esta conta Google (ana.costa@gmail.com) não está autorizada pela barbearia. Peça ao dono para cadastrar o seu e-mail.'}else{let c=CL.find(x=>x.g);if(!c){c={id:Math.max(...CL.map(x=>x.id))+1,n:'Ana Paula Costa',t:'(21) 90000-0000',pl:'none',st:null,g:1};CL.push(c)}loginAs({n:c.n,e:'ana.costa@gmail.com',r:'client',cid:c.id})}}else loginAs(ACC[+v])}
 else if(a==='logout'){S.user=null;S.v='home';S.bf=null;S.gp=false;S.cell=null;S.ap=null;S.err='';S.af={}}
 else if(a==='dnav'){S.sd=v==='0'?0:S.sd+ +v;S.cell=null}
 else if(a==='cellx')S.cell=null;
 else if(a==='cf')S.cf=v;
 else if(a==='repeat'){const c=cl(S.cid),lv=lastVisit(c,v);if(lv){const bk=bb(lv.b).on?lv.b:null;S.bf={st:bk?'time':'pro',svs:lv.svs,b:bk,day:0,tm:null};if(bk)S.bf.day=firstDay(S.bf);S.ct='sv'}}
 else if(a==='bf-day'){S.bf.day=+v;S.bf.tm=null}
 else if(a==='bf-tm')S.bf.tm=v;
 else if(a==='bf-next')S.bf.st='conf';
 else if(a==='bf-back'){const o=['sv','pro','time','conf'],i=o.indexOf(S.bf.st);if(i<=0)S.bf=null;else S.bf.st=o[i-1]}
 else if(a==='bf-close')S.bf=null;
 else if(a==='bf-meus'){S.bf=null;S.ct='meus'}
 else if(a==='ct'){S.ct=v;S.sel=null;S.rf=null}
 else if(a==='rate')S.rf={id:+v,s:0,t:''};
 else if(a==='star'){const x=document.getElementById('rt');if(x)S.rf.t=x.value;S.rf.s=+v}
 else if(a==='norate')S.rf=null;
 else if(a==='sendrate'){if(!S.rf.s)return toast('Escolha de 1 a 5 estrelas.');const ap=AP.find(x=>x.id===S.rf.id),tx=document.getElementById('rt');RT.push({a:ap.id,b:ap.b,c:ap.c,s:S.rf.s,t:tx?tx.value.trim():''});S.rf=null;toast('Obrigado pela avaliação.')}
 else if(a==='done'){AP.find(x=>x.id==v).st='ok';toast('Serviço concluído.')}
 else if(a==='miss'){AP.find(x=>x.id==v).st='falt';toast('Falta registrada.')}
 else if(a==='undo'){delete AP.find(x=>x.id==v).st;toast('Situação desfeita.')}
 else if(a==='addb'){const nm=document.getElementById('nb').value.trim();if(!nm)return toast('Digite o nome do barbeiro.');BB.push({id:Math.max(...BB.map(x=>x.id))+1,n:nm,on:true,wk:[1,2,3,4,5,6],od:[]});toast('Barbeiro adicionado.')}
 else if(a==='delb'){const b=bb(+v),f=AP.filter(x=>x.b===b.id&&x.d>=iso(today())).length;if(f)return toast('Há '+f+' agendamentos futuros. Cancele antes de remover.');if(ACT().length<2)return toast('Mantenha ao menos um barbeiro.');b.on=false;toast('Barbeiro removido. O histórico continua no relatório.')}
 else if(a==='wk'){const p=v.split('|'),b=bb(+p[0]),n=+p[1];if(b.wk.includes(n)){const f=AP.filter(x=>x.b===b.id&&x.d>=iso(today())&&pd(x.d).getDay()===n).length;if(f)return toast(f+' agendamentos futuros nesse dia da semana. Cancele antes.');b.wk=b.wk.filter(x=>x!==n)}else b.wk.push(n)}
 else if(a==='addoff'){const b=bb(+v),dv=document.getElementById('fd'+v).value;if(!dv)return toast('Escolha a data da folga.');const f=AP.filter(x=>x.b===b.id&&x.d===dv).length;if(f)return toast(f+' agendamentos nesse dia. Cancele antes.');if(!b.od.includes(dv))b.od.push(dv);toast('Folga marcada.')}
 else if(a==='deloff'){const p=v.split('|'),b=bb(+p[0]);b.od=b.od.filter(y=>y!==p[1]);toast('Folga removida.')}
 else if(a==='sday'){S.sd=+v;S.cell=null}
 else if(a==='cell'){const[b,tm]=v.split('|');if(works(addD(S.sd),bb(+b)))S.cell={b:+b,tm}}
 else if(a==='add'){const sid=document.getElementById('ps').value;if(!fits(addD(S.sd),bb(S.cell.b),S.cell.tm,sv(sid).m,1))toast('O serviço não cabe nesse horário. Escolha outro.');else{AP.push({id:++uid,d:iso(addD(S.sd)),tm:S.cell.tm,b:S.cell.b,c:+document.getElementById('pc').value,s:sid});S.cell=null;toast('Agendado.')}}
 else if(a==='renew'){cl(v).st=iso(today());toast('Plano renovado por 1 mês.')}
 render();
});
document.addEventListener('input',e=>{if(e.target.id==='sq'){S.q=e.target.value;document.getElementById('svl').innerHTML=svList()}if(e.target.id==='cq'){S.cq=e.target.value;document.getElementById('cql').innerHTML=cliList(S.role==='dono')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.l){const b=document.querySelector('[data-a="submit"]');if(b)b.click()}});
document.addEventListener('change',e=>{
 const t=e.target,c=t.dataset.c;if(!c)return;
 if(c==='cid'){S.cid=+t.value;S.sel=null;S.rf=null;S.bf=null}
 else if(c==='sdate'){if(t.value){S.sd=Math.round((pd(t.value)-today())/864e5);S.cell=null}}
 else if(c==='role'){S.role=t.value;if(S.role!=='dono'&&(S.tab==='relat'||S.tab==='barb'))S.tab='agenda'}
 else if(c==='plan'){if(S.role!=='dono')return;const x=cl(t.dataset.id);x.pl=t.value;x.st=t.value==='none'?null:iso(today());toast('Plano alterado. Vigência de 1 mês a partir de hoje.')}
 else if(c==='price'){if(S.role!=='dono')return;sv(t.dataset.id).p=Math.max(0,+t.value||0);toast('Preço atualizado.')}
 render();
});
const ICO={sun:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',moon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
function applyTheme(m){document.documentElement.dataset.theme=m;const b=document.getElementById('th'),l=m==='dark'?'Ativar modo diurno':'Ativar modo noturno';b.innerHTML=m==='dark'?ICO.sun:ICO.moon;b.setAttribute('aria-label',l);b.title=l}
let saved=null;try{saved=localStorage.getItem('th')}catch(e){}
applyTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
document.getElementById('th').onclick=()=>{const m=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('th',m)}catch(e){}applyTheme(m)};
render();
